# =============================================================================
# GitHub Pages 部署工作流
# =============================================================================
# 触发：push 到 main 分支
# 行为：
#   1. 安装依赖
#   2. 类型检查 + ESLint
#   3. Vite 生产构建（产出 dist/）
#   4. 上传 dist/ 为 artifact
#   5. 部署到 GitHub Pages
#
# 部署后访问地址：
#   https://2645756121.github.io/yaoyi-map/
# =============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 防止并发部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NODE_ENV: production
          GITHUB_PAGES: "true"
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4