# =============================================================================
# GitHub Pages 部署工作流 v3
# =============================================================================
# 触发：push 到 main 分支
# 行为：
#   1. 安装依赖
#   2. 类型检查 + ESLint
#   3. Vite 生产构建（产出 dist/）
#   4. 上传 dist/ 为 artifact
#   5. 部署到 GitHub Pages
#
# 部署后访问地址：
#   https://2645756121.github.io/yaoyi-map/
#
# 修复记录：
#   - v3 (2026-07-28): 升级 Node 20 → 24 (弃用修复)
#                            升级 actions 到 v5+ (Node 24 兼容)
#                            添加 Pages 启用检查 (avoid 404)
#                            添加 SSH 凭据检查 (avoid deploy 失败)
# =============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_pages_check:
        description: 'Skip Pages enabled check (for testing)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# 防止并发部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NODE_ENV: production
          GITHUB_PAGES: "true"
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || (echo "❌ dist/index.html missing" && exit 1)
          test -d dist/assets || (echo "❌ dist/assets missing" && exit 1)
          echo "✓ Build artifacts OK"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Post-deploy verification
        run: |
          echo "✅ Deployment complete"
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
          echo "HTML check:"
          curl -fsS "${{ steps.deployment.outputs.page_url }}/" | head -c 200
          echo ""
          echo "Health check:"
          curl -fsS "${{ steps.deployment.outputs.page_url }}/healthz" || true