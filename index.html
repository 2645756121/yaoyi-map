<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <!--
      🟡 官方 Logo：LOGO(1).svg 主源 + logo.png / logo.svg 多级 fallback（见 Logo.tsx）
      图标（favicon / apple-touch-icon）必须用**按尺寸裁好的小图**：
      - 此前 PNG 图标直接指向 logo.png（1024×1024、1.13 MB），
        浏览器为渲染 16/32px 标签页图标会拉取整张 1.13 MB 原图 → 首屏白耗带宽。
      - 现改用 favicon-32.png（2.2 KB）与 apple-touch-180.png（40 KB），
        矢量图标用 logo.svg（10 KB）而不是 668 KB 的 LOGO(1).svg。
      Vite 构建时会按 base 配置自动改写 logo/ 下所有静态资源引用
    -->
    <link rel="icon" type="image/svg+xml" href="/logo/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo/apple-touch-180.png" />
    <link rel="apple-touch-icon-precomposed" href="/logo/apple-touch-180.png" />
    <meta name="theme-color" content="#90A686" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      🟡 官方 Logo 预加载：
      - 只预加载真正的首屏主源 LOGO(1).svg；
      - 不再预加载 logo.png：它是 Logo 降级链的第 2 级兜底（1.13 MB），
        正常路径下永远用不到，高速预加载只会与首屏关键资源抢带宽
        （Chrome 会报 "preloaded but not used" 警告）。
      - 注：base 部署在子路径（如 /yaoyi-map/）下时，Vite 构建会自动改写 HTML 中的 src
    -->
    <link
      rel="preload"
      as="image"
      type="image/svg+xml"
      href="/logo/LOGO(1).svg"
      fetchpriority="high"
    />
    <meta
      name="description"
      content="瑶医分布交互式地图：探索瑶族传统医学与草药资源的可视化平台"
    />
    <title>瑶医分布地图 · 探索瑶族传统医学</title>

    <!--
      Content-Security-Policy：
      - default-src 'self'：仅允许同源资源
      - img-src：允许 https 图片（含第三方 text_to_image API）
      - font-src：允许 Google Fonts
      - style/style-src：内联样式由 React/Vite 在开发环境注入
      - script-src：开发模式需 'unsafe-eval'（Vite HMR），生产环境仅 self
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: https://fonts.googleapis.com; frame-src 'self';"
    />

    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
