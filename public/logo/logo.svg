<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="logoTitle logoDesc" preserveAspectRatio="xMidYMid meet">
  <title id="logoTitle">瑶医分布地图 · 瑶族医药文化标识</title>
  <desc id="logoDesc">圆形徽章：外环蜜炙金，内含织锦几何花纹与本草绿草本纹，中心为瑶族医师（侧脸剪影）手持草药的轮廓，象征瑶医本草与图腾文化的融合。</desc>

  <defs>
    <!-- 外环渐变：蜜炙桃黄 → 草本绿 -->
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D1A1" />
      <stop offset="55%" stop-color="#D4AC6A" />
      <stop offset="100%" stop-color="#90A686" />
    </linearGradient>

    <!-- 内部背景渐变（米色） -->
    <radialGradient id="innerBackground" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FBF1E6" />
      <stop offset="100%" stop-color="#F2E2CD" />
    </radialGradient>

    <!-- 草药叶渐变 -->
    <linearGradient id="herbGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90A686" />
      <stop offset="100%" stop-color="#587851" />
    </linearGradient>

    <!-- 几何花纹渐变（蜜炙金） -->
    <linearGradient id="patternGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AC6A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A87D40" stop-opacity="0.9" />
    </linearGradient>

    <!-- 中央人物剪影渐变 -->
    <linearGradient id="robeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3E5940" />
      <stop offset="100%" stop-color="#243B25" />
    </linearGradient>

    <!-- 圆形裁剪（让所有内部图案限定在圆盘内） -->
    <clipPath id="circleClip">
      <circle cx="128" cy="128" r="118" />
    </clipPath>
  </defs>

  <!-- 圆形外底（透明背景下作为兜底） -->
  <circle cx="128" cy="128" r="124" fill="#F7EADF" />

  <!-- 内圆背景 -->
  <circle cx="128" cy="128" r="118" fill="url(#innerBackground)" />

  <!-- 圆内所有装饰图案（被 clipPath 约束在圆内） -->
  <g clip-path="url(#circleClip)">
    <!-- 左半部：科技线路纹理（淡绿） -->
    <g stroke="#90A686" stroke-opacity="0.32" stroke-width="0.7" fill="none" stroke-linecap="round">
      <path d="M 20 60 L 60 60 L 75 75 L 100 75" />
      <path d="M 20 80 L 50 80" />
      <path d="M 20 100 L 70 100 L 85 115 L 110 115" />
      <path d="M 30 130 L 60 130" />
      <path d="M 20 150 L 80 150 L 95 165" />
      <path d="M 40 180 L 70 180" />
      <path d="M 30 200 L 65 200" />
      <circle cx="60" cy="60" r="2" fill="#90A686" fill-opacity="0.4" />
      <circle cx="100" cy="75" r="1.5" fill="#90A686" fill-opacity="0.4" />
      <circle cx="70" cy="100" r="2" fill="#90A686" fill-opacity="0.4" />
      <circle cx="110" cy="115" r="1.5" fill="#90A686" fill-opacity="0.4" />
      <circle cx="60" cy="130" r="1.8" fill="#90A686" fill-opacity="0.4" />
      <circle cx="80" cy="150" r="1.8" fill="#90A686" fill-opacity="0.4" />
      <circle cx="70" cy="180" r="1.8" fill="#90A686" fill-opacity="0.4" />
      <circle cx="65" cy="200" r="1.8" fill="#90A686" fill-opacity="0.4" />
    </g>

    <!-- 右半部：织锦菱形纹理（同心菱形 + 回形纹 + 中心纹） -->
    <g opacity="0.78">
      <path d="M 200 50 L 250 128 L 200 206 L 150 128 Z" fill="none" stroke="url(#patternGradient)" stroke-width="1.2" stroke-linejoin="round" />
      <path d="M 200 70 L 235 128 L 200 186 L 165 128 Z" fill="none" stroke="url(#patternGradient)" stroke-width="1.2" stroke-linejoin="round" />
      <path d="M 200 90 L 220 128 L 200 166 L 180 128 Z" fill="none" stroke="url(#patternGradient)" stroke-width="1.2" stroke-linejoin="round" />
      <path d="M 200 110 L 210 128 L 200 146 L 190 128 Z" fill="url(#patternGradient)" />

      <!-- 回形装饰 -->
      <g stroke="#A87D40" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 215 80 L 230 80 L 230 95" />
        <path d="M 185 80 L 170 80 L 170 95" />
        <path d="M 215 176 L 230 176 L 230 161" />
        <path d="M 185 176 L 170 176 L 170 161" />
      </g>

      <!-- 中心莲花/太阳纹（小型） -->
      <g transform="translate(200, 110)" stroke="#A87D40" stroke-width="0.9" stroke-linecap="round" fill="none">
        <circle r="4" />
        <line x1="0" y1="-7" x2="0" y2="-5" />
        <line x1="5" y1="-5" x2="3.5" y2="-3.5" />
        <line x1="7" y1="0" x2="5" y2="0" />
        <line x1="5" y1="5" x2="3.5" y2="3.5" />
        <line x1="0" y1="7" x2="0" y2="5" />
        <line x1="-5" y1="5" x2="-3.5" y2="3.5" />
        <line x1="-7" y1="0" x2="-5" y2="0" />
        <line x1="-5" y1="-5" x2="-3.5" y2="-3.5" />
      </g>
    </g>

    <!-- 左下角本草绿草药环 -->
    <g transform="translate(72, 178)" opacity="0.55">
      <circle r="14" fill="none" stroke="#90A686" stroke-width="0.9" stroke-dasharray="2 1.6" />
      <path d="M 0 -10 Q 4 -5 0 0 Q -4 -5 0 -10" fill="#587851" />
    </g>

    <!-- 中心：瑶族医师（女性）剪影 -->
    <g transform="translate(118, 138)">
      <!-- 头饰外轮廓（瑶族凤冠） -->
      <path
        d="M -22 -58 Q -28 -72 -16 -76 L 16 -76 Q 28 -72 22 -58 Q 30 -52 26 -42 Q 20 -46 16 -42 L -16 -42 Q -20 -46 -26 -42 Q -30 -52 -22 -58 Z"
        fill="url(#robeGradient)"
        stroke="#102514"
        stroke-width="0.9"
      />
      <!-- 头饰金色装饰横线 -->
      <g stroke="#D4AC6A" stroke-width="0.9" fill="none" stroke-linecap="round">
        <path d="M -14 -73 L 14 -73" />
        <path d="M -11 -68 L 11 -68" />
        <path d="M -8 -63 L 8 -63" />
      </g>
      <!-- 头饰中央宝石 -->
      <circle cx="0" cy="-60" r="1.6" fill="#F0D1A1" stroke="#D4AC6A" stroke-width="0.5" />
      <!-- 头饰右侧垂饰（流苏） -->
      <line x1="22" y1="-42" x2="22" y2="-26" stroke="#D4AC6A" stroke-width="0.9" />
      <circle cx="22" cy="-26" r="1.6" fill="#F0D1A1" stroke="#D4AC6A" stroke-width="0.5" />

      <!-- 脸部（侧脸，闭目微笑，朝左） -->
      <path
        d="M -10 -42 Q -14 -34 -12 -26 Q -10 -20 -6 -18 L -4 -18 Q -2 -22 -3 -28 Q -5 -36 -7 -42 Z"
        fill="#F2E2CD"
        stroke="#243B25"
        stroke-width="0.8"
      />

      <!-- 眼睛（闭目） -->
      <path d="M -10 -32 Q -8 -30 -6 -32" fill="none" stroke="#243B25" stroke-width="0.9" stroke-linecap="round" />

      <!-- 鼻子 -->
      <path d="M -11 -27 L -12 -24 L -10 -24" fill="none" stroke="#243B25" stroke-width="0.6" stroke-linecap="round" />

      <!-- 嘴（微笑） -->
      <path d="M -11 -21 Q -9 -20 -7 -21" fill="none" stroke="#243B25" stroke-width="0.7" stroke-linecap="round" />

      <!-- 颈部 -->
      <path d="M -7 -18 L -8 -10 L 6 -10 L 5 -18 Z" fill="#F2E2CD" stroke="#243B25" stroke-width="0.7" />

      <!-- 项圈（蜜炙金） -->
      <path d="M -8 -10 Q 0 -6 8 -10" fill="none" stroke="#F0D1A1" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="-8" cy="-10" r="0.9" fill="#D4AC6A" />
      <circle cx="8" cy="-10" r="0.9" fill="#D4AC6A" />
      <circle cx="0" cy="-7" r="1.1" fill="#F0D1A1" />

      <!-- 衣领（梯形小领） -->
      <path d="M -12 -10 L -5 0 L 5 0 L 12 -10 Z" fill="#587851" stroke="#243B25" stroke-width="0.7" />

      <!-- 衣身（梯形长袍） -->
      <path
        d="M -26 0 Q -32 24 -30 56 L -24 88 L 24 88 L 30 56 Q 32 24 26 0 L 12 0 L 0 8 L -12 0 Z"
        fill="url(#robeGradient)"
        stroke="#102514"
        stroke-width="0.9"
      />

      <!-- 衣身金色花纹（竖线 + 横线） -->
      <g stroke="#F0D1A1" stroke-width="0.6" fill="none" opacity="0.7">
        <path d="M -23 4 L -22 60" />
        <path d="M 23 4 L 22 60" />
        <path d="M -20 20 L 20 20" />
        <path d="M -21 42 L 21 42" />
        <path d="M -22 70 L 22 70" />
      </g>

      <!-- 衣身中部几何纹（瑶族菱形纹） -->
      <g transform="translate(0, 40)" stroke="#F0D1A1" stroke-width="0.9" fill="none">
        <path d="M -9 0 L 0 -5 L 9 0 L 0 5 Z" />
        <path d="M -6 0 L 0 -3 L 6 0 L 0 3 Z" />
      </g>

      <!-- 左臂（举起持草药，朝左下） -->
      <path
        d="M -26 0 Q -38 -22 -48 -50 Q -54 -64 -60 -72"
        fill="none"
        stroke="#587851"
        stroke-width="5"
        stroke-linecap="round"
      />

      <!-- 右手臂（自然下垂） -->
      <path
        d="M 26 0 Q 32 22 33 56"
        fill="none"
        stroke="#587851"
        stroke-width="5"
        stroke-linecap="round"
      />

      <!-- 手掌（托起草药） -->
      <ellipse cx="-62" cy="-72" rx="7" ry="4.5" fill="#F2E2CD" stroke="#243B25" stroke-width="0.8" />
    </g>

    <!-- 草药（左上托起处） -->
    <g transform="translate(48, 60)">
      <!-- 主茎 -->
      <path d="M 0 0 Q 6 -16 16 -28" fill="none" stroke="#587851" stroke-width="1.6" stroke-linecap="round" />

      <!-- 大叶 -->
      <path
        d="M 5 -14 Q -2 -22 5 -30 Q 14 -24 11 -14 Z"
        fill="url(#herbGradient)"
        stroke="#243B25"
        stroke-width="0.6"
      />
      <path d="M 5 -30 L 5 -14" stroke="#243B25" stroke-width="0.5" fill="none" />

      <!-- 小叶 -->
      <path
        d="M 10 -20 Q 14 -27 19 -22 Q 16 -17 11 -17 Z"
        fill="url(#herbGradient)"
        stroke="#243B25"
        stroke-width="0.6"
      />

      <!-- 第三片叶 -->
      <path
        d="M 9 -6 Q 16 -6 19 0 Q 12 3 9 -3 Z"
        fill="url(#herbGradient)"
        stroke="#243B25"
        stroke-width="0.6"
      />

      <!-- 浆果（蜜炙桃黄） -->
      <circle cx="-1" cy="-30" r="2.2" fill="#F0D1A1" stroke="#D4AC6A" stroke-width="0.6" />
      <circle cx="4" cy="-34" r="1.6" fill="#F0D1A1" stroke="#D4AC6A" stroke-width="0.5" />
      <circle cx="-5" cy="-25" r="1.6" fill="#F0D1A1" stroke="#D4AC6A" stroke-width="0.5" />
    </g>
  </g>

  <!-- 圆框装饰（外环） -->
  <circle cx="128" cy="128" r="122" fill="none" stroke="url(#ringGradient)" stroke-width="3.5" />
  <!-- 圆框装饰（内环虚线） -->
  <circle cx="128" cy="128" r="117" fill="none" stroke="#90A686" stroke-width="0.9" stroke-dasharray="1.5 2.2" opacity="0.55" />
</svg>