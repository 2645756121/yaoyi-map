<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg-灵芝" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E6DA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F5E6DA" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="weave-灵芝" patternUnits="userSpaceOnUse" width="20" height="20">
      <path d="M 0,10 L 20,10 M 10,0 L 10,20" stroke="#A0432B" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- 背景渐变 -->
  <rect width="100%" height="100%" fill="url(#bg-灵芝)"/>

  <!-- 本草图鉴纹饰底纹 -->
  <rect width="100%" height="100%" fill="url(#weave-灵芝)"/>

  <!-- 边框（仿古医书风格） -->
  <rect x="6" y="6" width="388" height="288" fill="none" stroke="#A0432B" stroke-width="2" opacity="0.4"/>
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#A0432B" stroke-width="0.5" opacity="0.3"/>

  <!-- 顶部装饰横线 -->
  <line x1="20" y1="22" x2="380" y2="22" stroke="#A0432B" stroke-width="1" opacity="0.5"/>
  <text x="20" y="18" font-family="Noto Sans SC, serif" font-size="9" fill="#A0432B" opacity="0.7">本草图鉴</text>
  <text x="380" y="18" text-anchor="end" font-family="serif" font-size="9" fill="#A0432B" opacity="0.7">HERBARIUM</text>

  
        <!-- 蘑菇 / 灵芝 -->
        <g transform="translate(200, 135)">
          <ellipse cx="0" cy="20" rx="55" ry="12" fill="#A0432B" opacity="0.2"/>
          <path d="M -45,5 Q -45,-30 0,-35 Q 45,-30 45,5 Z" fill="#A0432B" opacity="0.9" stroke="#A0432B" stroke-width="2"/>
          <ellipse cx="0" cy="-15" rx="35" ry="8" fill="#fff" opacity="0.3"/>
          <ellipse cx="-12" cy="-5" rx="6" ry="3" fill="#fff" opacity="0.4"/>
          <ellipse cx="10" cy="-8" rx="5" ry="2" fill="#fff" opacity="0.4"/>
          <path d="M -8,5 L -8,55 Q -8,65 0,65 Q 8,65 8,55 L 8,5" fill="#A0432B" opacity="0.85" stroke="#A0432B" stroke-width="1.5"/>
        </g>

  <!-- 名称 -->
  <g transform="translate(200, 250)">
    <text text-anchor="middle" font-family="Noto Sans SC, serif" font-size="22" font-weight="700" fill="#A0432B">灵芝</text>
    <text text-anchor="middle" y="22" font-family="serif" font-size="10" font-style="italic" fill="#A0432B" opacity="0.8">Ganoderma lucidum</text>
    <line x1="-40" y1="32" x2="40" y2="32" stroke="#A0432B" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- 角标 -->
  <text x="14" y="290" font-family="serif" font-size="8" fill="#A0432B" opacity="0.5">Real · Plant · 2026</text>
  <text x="386" y="290" text-anchor="end" font-family="serif" font-size="8" fill="#A0432B" opacity="0.5">YaoYi · 瑶药</text>
</svg>