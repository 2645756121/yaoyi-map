<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="瑶医分布地图">
  <title>瑶医分布地图</title>
  <!-- 简化的瑶医 logo（适配 32x32 favicon）：圆形外框 + 草药叶 + 中心花 -->
  <defs>
    <linearGradient id="ring32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D1A1" />
      <stop offset="100%" stop-color="#90A686" />
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="15.5" fill="#F7EADF" />
  <circle cx="16" cy="16" r="15.5" fill="none" stroke="url(#ring32)" stroke-width="1.2" />
  <!-- 中心：草药叶 -->
  <path d="M 16 8 Q 11 12 11 18 Q 11 22 16 24 Q 21 22 21 18 Q 21 12 16 8 Z" fill="url(#ring32)" stroke="#587851" stroke-width="0.5" />
  <path d="M 16 9 L 16 23" stroke="#587851" stroke-width="0.5" fill="none" />
  <!-- 顶部蜜炙黄浆果 -->
  <circle cx="16" cy="6" r="2" fill="#F0D1A1" stroke="#D4AC6A" stroke-width="0.4" />
</svg>