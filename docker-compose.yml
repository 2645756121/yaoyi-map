# =============================================================================
# 瑶医分布地图 - Docker Compose 编排
# =============================================================================
# 使用：
#   - 开发/演示：docker compose up -d
#   - 生产环境：结合 .env.production 与反向代理（Nginx / Traefik / Caddy）
# =============================================================================

name: yaoyi-map

services:
  # -----------------------------------------------------------
  # 主应用：基于 nginx:alpine 提供静态 SPA 服务
  # -----------------------------------------------------------
  yaoyi-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_VERSION: ${APP_VERSION:-1.0.0}
        VITE_BUILD_TIME: ${VITE_BUILD_TIME}
    image: yaoyi-map:${APP_VERSION:-1.0.0}
    container_name: yaoyi-map
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      # Vite 构建期环境变量（注入到 index.html meta / runtime config）
      - NODE_ENV=production
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      # 挂载自定义 nginx 配置（如需覆盖默认配置）
      - ./docker/conf.d:/etc/nginx/conf.d:ro
      # 日志持久化（生产建议挂载到宿主机或接入 ELK）
      - ./logs/nginx:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - yaoyi-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

  # -----------------------------------------------------------
  # 反向代理（可选）：仅当用 compose 同时托管时启用
  # 生产环境推荐使用云厂商负载均衡 / CDN / Cloudflare
  # -----------------------------------------------------------
  # yaoyi-proxy:
  #   image: nginx:alpine
  #   container_name: yaoyi-proxy
  #   restart: unless-stopped
  #   ports:
  #     - "443:443"
  #     - "80:80"
  #   volumes:
  #     - ./docker/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./docker/proxy/conf.d:/etc/nginx/conf.d:ro
  #     - ./docker/proxy/certs:/etc/nginx/certs:ro
  #   depends_on:
  #     yaoyi-app:
  #       condition: service_healthy
  #   networks:
  #     - yaoyi-net

networks:
  yaoyi-net:
    driver: bridge
    name: yaoyi-net

# =============================================================================
# 卷定义：日志持久化（按需启用）
