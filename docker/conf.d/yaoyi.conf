# =============================================================================
# 瑶医分布地图 - 站点配置
# =============================================================================
# 处理：
#   - HTTP→HTTPS 强制跳转（生产环境开启）
#   - SPA fallback：所有未匹配的非资源路径 fall back 到 /index.html
#   - 强安全 HTTP 头（CSP / HSTS / X-Frame-Options 等）
#   - 静态资源 1 年 immutable 缓存
#   - GeoJSON 数据 7 天缓存
#   - 健康检查端点 /healthz
#   - 服务监控端点 /metrics（简化版，仅返回 200）
# =============================================================================

# ---- HTTP → HTTPS 跳转（生产部署时启用） ----
# 如未配置 HTTPS 证书，注释下方整个 server 块
# server {
#     listen 80;
#     listen [::]:80;
#     server_name yaoyi.your-domain.com;
#
#     # 健康检查（ALB / 负载均衡器跳过 HTTPS）
#     location = /healthz { access_log off; return 200 'ok'; }
#
#     # ACME challenge（Let's Encrypt）
#     location /.well-known/acme-challenge/ {
#         root /var/www/certbot;
#     }
#
#     location / {
#         return 301 https://$host$request_uri;
#     }
# }

# ---- HTTPS 主站点 ----
server {
    # 如启用 HTTPS 则 listen 443 ssl http2，否则删去 ssl 相关并 listen 80
    listen 80;
    listen [::]:80;
    server_name _;

    # 根目录：构建产物
    root /usr/share/nginx/html;
    index index.html;

    # 字符集与编码
    charset utf-8;

    # ✅ SPA fallback：所有路径未命中时 fall back 到 index.html
    #   重要：先 try_files，再 fallback，否则 /index.html 自身会死循环
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ✅ 健康检查（K8s liveness probe / ALB health check）
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store";
        return 200 'ok\n';
    }

    location = /readyz {
        access_log off;
        add_header Cache-Control "no-store";
        return 200 'ready\n';
    }

    # 简化监控端点：返回 200 + app version（生产环境可对接 Prometheus exporter）
    location = /metrics {
        access_log off;
        add_header Cache-Control "no-store";
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 'yaoyi_map_build_info{version="1.0.0"} 1\n';
    }

    # ---- 静态资源缓存 ----
    # Vite 构建产物带 hash（index-3qyYGH64.js），永久 immutable 缓存
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpg|jpeg|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # ---- GeoJSON 数据缓存 ----
    # 县级/省级 GeoJSON 数据可长时间缓存
    location ~* ^/map/.*\.json$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        # ✅ 支持 CORS（兼容跨域 GeoJSON 请求）
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    }

    # HTML 入口：不缓存（避免发布后用户拿到旧版本）
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ---- 错误页 ----
    error_page 404 /index.html;        # SPA fallback：避免 404 直接给用户
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ============================================================
    # 安全 HTTP 头
    # ============================================================
    # ✅ HSTS（仅 HTTPS 启用；HTTP 模式下无效）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ✅ 防止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;

    # ✅ Clickjacking 防护
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ✅ Referrer 控制
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ✅ 跨域策略
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ✅ 权限策略：禁用本项目不需要的硬件能力
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # ✅ CSP：限制资源来源（与 index.html 中 meta 一致）
    #   注意：mapbox/leaflet CDN 端点按需调整；本项目为完全本地化资源
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https:; frame-ancestors 'self'; frame-src 'self'; worker-src 'self' blob:; manifest-src 'self';" always;

    # 隐藏 X-Powered-By
    proxy_hide_header X-Powered-By;

    # 自定义日志（生产可对接 ELK / Loki）
    access_log /var/log/nginx/access.log json_combined;
}
